name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      # Unused files, exports and dependencies. Dead code typechecks and
      # passes every test, so nothing else here would catch it.
      - run: bun run knip
      - run: bun run test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # GitHub-hosted runners ship Docker preinstalled. The integration
      # suite spawns its own throwaway Radicale container (see
      # apps/server/test/integration/helpers/radicale.ts) — no separate
      # server setup step needed.
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The suite runs two app servers: one against a real Radicale (the
      # `desktop-real` project, one spec) and one against the BFF's
      # in-memory fake CalDAV gateway (everything else) — see
      # docs/specs/testing.md. Both are started by Playwright's own
      # `webServer` config, and the fake mode's `CALDAV_FAKE` env var is
      # set there rather than here.
      #
      # Docker is still needed, but only for the real project's throwaway
      # container — same approach as the integration suite, see
      # e2e/helpers/radicale-container.ts. `global-setup.ts` skips starting
      # it entirely when no project needs it.
      - run: bun install --frozen-lockfile
      - run: bun run e2e:install
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
