# Releases, and the image self-hosters run (docs/specs/releases.md).
#
# Three jobs, in order:
#
# 1. **release-please** keeps a rolling "chore: release X.Y.Z" PR open,
#    accumulating the changelog from Conventional Commit messages as they
#    land on main. Nothing is released until that PR is merged, which is
#    the deliberate gate: merging it tags the version and cuts a GitHub
#    Release.
# 2. **publish** then builds the image and pushes it to ghcr.io — but only
#    on the run where a release was actually created, hence the `if` on
#    `needs.release.outputs.released`.
# 3. **publish-cli** builds the Node CLI and publishes it to npm from that
#    same release version.
name: release

on:
  push:
    branches: [main]
  # Republish an existing release's image without cutting a new version.
  # A re-run of a failed run is pinned to the commit it ran against, so it
  # cannot pick up a fix; dispatching against the moved tag can.
  # *(added 2026-08-17, after the v1.0.0 image build failed on a Dockerfile
  # bug and there was no way to rebuild it as 1.0.0.)*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.0.0'
        required: true

# The default GITHUB_TOKEN is enough for both jobs, so there is no PAT to
# rotate. Each job narrows to what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, and commit the changelog
      pull-requests: write # open and update the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    # Always on a dispatch; on push only when a release was actually cut.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || needs.release.outputs.released == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      # attestations + id-token are only needed by the provenance step at
      # the foot of this job, which is commented out — see the note there.
      # Left out rather than granted for something that does not run.
    steps:
      # On a dispatch, build the named tag rather than the default branch.
      # `ref: ''` falls back to the default checkout on a push.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || '' }}

      # arm64 matters here: a lot of self-hosters run this on a Raspberry
      # Pi or an ARM NAS, and an amd64-only image simply will not start
      # there. Building arm64 under QEMU is slow, but this runs once per
      # release rather than on every push.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because ghcr.io rejects uppercase in a repository name
      # and the owner here is `JackCuthbert`.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # On a push this is release-please's tag; on a dispatch it is the tag
      # that was asked for.
      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || needs.release.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # `1.2.3`, `1.2`, `1`, and `latest`. The bare major is the tag
          # worth pinning to — it tracks every compatible release and stops
          # at the next breaking change, which is a promise semver only
          # makes from 1.0 onward (docs/specs/releases.md).
          # *(changed 2026-08-17: added `{{major}}`, which was deliberately
          # omitted while the project was pre-1.0 and `0` would have moved
          # across breaking changes.)*
          #
          # `latest` is not listed: `type=semver` adds it automatically for
          # a non-prerelease version, and naming it as well emitted the tag
          # twice in the first run's tag list. *(fixed 2026-08-10.)*
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.name }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed provenance, so someone pulling the image can verify it was
      # built by this workflow from this repo rather than pushed by hand.
      #
      # DISABLED until the repository is public. Attestations are not
      # available for user-owned *private* repositories, and the step fails
      # with "Feature not available for user-owned private repositories" —
      # after the image has already been pushed, so it fails the run
      # without failing the publish. Nothing here is wrong; the feature
      # simply is not offered yet.
      #
      # To re-enable: uncomment this step, and restore `attestations: write`
      # and `id-token: write` to this job's permissions above.
      # *(commented out 2026-08-10, on the first release.)*
      #
      # - uses: actions/attest-build-provenance@v4
      #   with:
      #     subject-name: ${{ steps.image.outputs.name }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true

  publish-cli:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @jackcuthbert/fold-cli build
      - run: npm publish --workspace apps/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
