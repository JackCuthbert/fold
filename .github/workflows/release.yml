# Releases, and the image self-hosters run (docs/specs/releases.md).
#
# Three jobs, in order:
#
# 1. **release-please** maintains separate release PRs for Fold and the CLI,
#    using the file allowlist in scripts/release-paths.ts.
#    Merging a release PR tags its version and cuts a GitHub Release.
# 2. **publish** then builds the image and pushes it to ghcr.io — but only
#    on the run where a release was actually created, hence the `if` on
#    `needs.release.outputs.released`.
# 3. **publish-cli** builds and publishes npm only when a CLI release is cut.
name: release

on:
  push:
    branches: [main]
  # Republish an existing release's image without cutting a new version.
  # A re-run of a failed run is pinned to the commit it ran against, so it
  # cannot pick up a fix; dispatching against the moved tag can.
  # *(added 2026-08-17, after the v1.0.0 image build failed on a Dockerfile
  # bug and there was no way to rebuild it as 1.0.0.)*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.0.0'
        required: true

# The default GITHUB_TOKEN is enough for all jobs, so there is no PAT to
# rotate. Each job narrows to what it needs.
permissions: {}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # tag, and commit the changelog
      pull-requests: write # open and update the release PR
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      cli-released: ${{ steps.release.outputs.cli-released }}
      cli-tag: ${{ steps.release.outputs.cli-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    # Always on a dispatch; on push only when a release was actually cut.
    if: >-
      ${{
        always()
        && (
          github.event_name == 'workflow_dispatch'
          || needs.release.outputs.released == 'true'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      attestations: write
      id-token: write
    steps:
      # On a dispatch, build the named tag rather than the default branch.
      # On a push, build the exact app release rather than the triggering commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || needs.release.outputs.tag }}

      # arm64 matters here: a lot of self-hosters run this on a Raspberry
      # Pi or an ARM NAS, and an amd64-only image simply will not start
      # there. Building arm64 under QEMU is slow, but this runs once per
      # release rather than on every push.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because ghcr.io rejects uppercase in a repository name
      # and the owner here is `JackCuthbert`.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # On a push this is release-please's tag; on a dispatch it is the tag
      # that was asked for.
      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || needs.release.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # `1.2.3`, `1.2`, `1`, and `latest`. The bare major is the tag
          # worth pinning to — it tracks every compatible release and stops
          # at the next breaking change, which is a promise semver only
          # makes from 1.0 onward (docs/specs/releases.md).
          # *(changed 2026-08-17: added `{{major}}`, which was deliberately
          # omitted while the project was pre-1.0 and `0` would have moved
          # across breaking changes.)*
          #
          # `latest` is not listed: `type=semver` adds it automatically for
          # a non-prerelease version, and naming it as well emitted the tag
          # twice in the first run's tag list. *(fixed 2026-08-10.)*
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.name }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed provenance, so someone pulling the image can verify it was
      # built by this workflow from this repo rather than pushed by hand.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-cli:
    needs: release
    if: needs.release.outputs.cli-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.cli-tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @jackcuthbert/fold-cli build
      - run: npm publish --workspace apps/cli --access public
