<!-- The Fold mark: Lucide's `origami` glyph, the same one the nav header
     renders (main-screen.tsx — LuOrigami). Folded paper, and the fold that
     tucks finished work out of sight (docs/specs/overview.md).

     Copied rather than imported: react-icons is a bundled runtime
     dependency and this file is served statically before any JS runs.
     If the nav mark ever changes, change this too.

     Colour follows the tab's theme via prefers-color-scheme, using the
     --ink values from styles/tokens.css directly — a favicon renders
     outside the app's DOM, so it cannot inherit the custom properties.
     The 2px inset viewBox padding stops the strokes touching the edge at
     16px, where a browser tab actually shows this. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" width="32" height="32">
  <style>
    path { stroke: #1a1816; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #ece7dd; }
    }
  </style>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12V4a1 1 0 0 1 1-1h6.297a1 1 0 0 1 .651 1.759l-4.696 4.025" />
    <path d="m12 21-7.414-7.414A2 2 0 0 1 4 12.172V6.415a1.002 1.002 0 0 1 1.707-.707L20 20.009" />
    <path d="m12.214 3.381 8.414 14.966a1 1 0 0 1-.167 1.199l-1.168 1.163a1 1 0 0 1-.706.291H6.351a1 1 0 0 1-.625-.219L3.25 18.8a1 1 0 0 1 .631-1.781l4.165.027" />
  </g>
</svg>
